# Sebas 配置示例（design.md §3.4 配置树）
# M0 单账号 MVP：一个 email 账号 + 一个 agent。
# 敏感值经 ${ENV} 展开；provider 密钥在 gateway 启动时迁入加密 vault。
channels:
  email:
    accounts:
      - id: personal-mailbox
        platform: imap.example.com    # 同时作 IMAP 与 SMTP 主机（Gmail 用 imap.gmail.com + 465/implicit，
                                      # 该组合依赖非规范的 SMTPS 支持，正确解是加 smtp.host，见 design.md §5.4）
        receive: imap-idle            # imap-idle | gmail-api（后者未实现，见 design.md §5.4）
        smtp:
          port: 465
          tls: implicit               # implicit | starttls | none
        credentials:                  # M0 明文过渡（keyring M1-WP7）
          user: ${MAIL_USER}
          password: ${MAIL_PASSWORD}

# provider 层（#214）：厂商级配置——密钥 / base_url / 协议格式。
# 多个 agent 引用同一 provider 共享一份密钥，热更新轮换一次全体生效。
providers:
  deepseek:
    api_key: ${LLM_API_KEY}
    base_url: https://api.deepseek.com
    protocol: openai-compatible       # openai-compatible | anthropic
  # anthropic 示例（显式协议路径，非流式纯文本）：
  # anthropic:
  #   api_key: ${ANTHROPIC_API_KEY}
  #   base_url: https://api.anthropic.com/v1
  #   protocol: anthropic

agents:
  main:
    provider: deepseek                # 引用 providers.<name>
    model: deepseek-chat              # 裸模型名（不再用 <provider>/ 前缀编码厂商）
    persona_file: agents/main/SOUL.md
    memory:
      window: 50
    tools:
      allow: ["*"]
  # 旧写法仍可加载（启动时输出迁移指引，不静默失败）：
  # main:
  #   model: deepseek/chat             # 遗留：<provider>/<model> 前缀推断
  #   api_key: ${LLM_API_KEY}          # 遗留：agent 级密钥（建议迁 providers.<p>.api_key）

bindings:
  - channel: email
    account: personal-mailbox
    peer: "*"
    agent: main

gateway:
  http:
    bind: 127.0.0.1
    port: 18790
    auth: token                       # token | password | tailscale
  ipc:
    mode: auto                        # auto | unix | tcp | off
    port: 18791
  data_dir: data                     # 相对值以本配置文件所在目录为基准；省略时默认 <home>/data
                                     # home 根：默认 ~/.sebas，可用 SEBAS_HOME 覆盖（空白值拒启）
