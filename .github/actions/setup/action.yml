name: Setup Crystal + SQLite
description: >
  Install Crystal, Shards and a SQLite3 development library for the current OS,
  so `shards install` and `crystal build` work on Windows, Linux and macOS.

inputs:
  crystal:
    description: Crystal version to install.
    required: false
    default: latest

runs:
  using: composite
  steps:
    # 自托管 runner 上 Crystal 工具链本来不跨 job 保留：install-crystal 把官方
    # 包解压到 $RUNNER_TEMP，而 runner 每个 job 开始都清空 RUNNER_TEMP
    # （TempDirectoryManager），于是同一台机器每个 job 重下 ~57MB 再解压，
    # 实测 Setup toolchain 固定多花 10-15s。
    #
    # 这里在自托管类 Unix runner 上把工具链装进 runner 自己的工具缓存
    # （_work/_tool，跨 job 持久）并按版本分目录，命中就只导出 PATH。判断上游
    # 最新版只发一个 HEAD 读 302 的 Location。并发、降级与兜底规则见同目录
    # crystal-cache.sh。Windows 不参与：那边的包结构与 PATH 语义不同，未在本机验证。
    - name: Prepare Crystal toolchain cache
      id: crystal_cache
      if: runner.environment == 'self-hosted' && runner.os != 'Windows'
      shell: bash
      env:
        CRYSTAL_REQUESTED: ${{ inputs.crystal }}
      run: bash "${{ github.action_path }}/crystal-cache.sh" prepare

    # 自托管 runner 用 runner token 发请求，避免匿名调用被 GitHub 限流。
    # destination 为空（托管 runner，或缓存不可用）时 install-crystal 回落到
    # 自己默认的 $RUNNER_TEMP/crystal-<version>-<shards>-<arch>，行为不变。
    - name: Install Crystal
      if: steps.crystal_cache.outputs.hit != 'true'
      uses: crystal-lang/install-crystal@47f17b5ecff0cc09e96fa95f5220311329bf4bc8 # v1
      with:
        crystal: ${{ inputs.crystal }}
        destination: ${{ steps.crystal_cache.outputs.destination }}
        token: ${{ github.token }}

    # 缓存命中时 install-crystal 不会跑，它注册的 error annotation matcher 也就
    # 不会生效——补齐一份（内容取自 crystal-lang/install-crystal v1 的 .github/，
    # 随本仓版本钉住），让编译/测试错误在 PR 里照常有标注。
    - name: Register Crystal problem matchers
      if: steps.crystal_cache.outputs.hit == 'true'
      shell: bash
      run: |
        echo "::add-matcher::${{ github.action_path }}/matchers/crystal.json"
        echo "::add-matcher::${{ github.action_path }}/matchers/crystal-spec.json"

    # 无论安装成没成功都要放锁：失败时残留的目录会被下一个 job 判为不可复用
    # 后清掉；锁不放则要等 TTL 过期。
    - name: Release Crystal toolchain cache lock
      if: always() && steps.crystal_cache.outputs.lock != ''
      shell: bash
      run: bash "${{ github.action_path }}/crystal-cache.sh" release "${{ steps.crystal_cache.outputs.lock }}"

    - name: Install SQLite3 (Linux)
      if: runner.os == 'Linux'
      shell: bash
      # *-dev packages ship the .a archives used by the static release link
      run: |
        sudo apt-get update
        sudo apt-get install -y libsqlite3-dev libyaml-dev libpcre2-dev

    # macOS 自带 SQLite（含 FTS5），但不带 OpenSSL 开发文件：自托管机器上
    # `crystal build` 会报 `ld: library not found for -lssl`。
    #
    # 这里**只探测、绝不安装**：这台机器上 `brew install` 会顺带升级 git，
    # 拉到 ftp.gnu.org 的 gettext/libunistring 时网络失败，整条流水线跟着红
    # （实测两次）。思路是纯定位——在 Homebrew 目录里找现成的 openssl keg，
    # 再用 CRYSTAL_LIBRARY_PATH 直接把 keg 交给 Crystal，绕过 pkg-config。
    - name: Locate OpenSSL toolchain (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -euo pipefail

        if ! xcrun --find clang >/dev/null 2>&1; then
          echo "::error::clang not found — install Xcode Command Line Tools on the self-hosted runner: xcode-select --install"
          exit 1
        fi

        brew_bin=""
        for candidate in /opt/homebrew/bin/brew /usr/local/bin/brew "$(command -v brew 2>/dev/null || true)"; do
          if [ -x "$candidate" ]; then
            brew_bin="$candidate"
            break
          fi
        done
        if [ -z "$brew_bin" ]; then
          echo "::error::Homebrew not found — install it on the self-hosted runner: https://brew.sh"
          exit 1
        fi
        brew_prefix="$("$brew_bin" --prefix)"

        # 直接扫 keg 目录，不调用 brew（避免任何隐式升级）。
        #
        # **只认带版本后缀的 keg（@3 / @4），排除无后缀的 `openssl` 软链**：
        # 该软链可能指向陈旧 keg——macos-ci 实测它指向 openssl@1.1/1.1.1g
        # （2020 年版本），Crystal 1.22.x 的 LibCrypto 绑定按 OpenSSL 3+ 声明，
        # 链接 1.1 会在编译期报 `undefined method 'ctrl=' for
        # LibCrypto::BioMethod`（main d7d7b3c 的 spec / macos-ci 实测）。
        # 宁可明确报错指引安装，也不静默落到错误版本。
        scan_kegs() {
          for dir in \
            "$brew_prefix/opt/openssl@3" \
            "$brew_prefix/opt/openssl@4" \
            /usr/local/opt/openssl@3 \
            /usr/local/opt/openssl@4; do
            if [ -f "$dir/lib/libssl.dylib" ] || [ -f "$dir/lib/libssl.a" ]; then
              printf '%s' "$dir"
              return 0
            fi
          done
          return 1
        }

        openssl_prefix="$(scan_kegs || true)"

        # 自举（Maintainer 2026-11-23 批准，issue #5/#45 解锁路径）：keg 或
        # pkg-config 缺失时就地安装，免手工登机。install 对已装 formula 是
        # no-op（幂等）；HOMEBREW_NO_AUTO_UPDATE=1 压掉隐式 brew update——
        # 上方注释记录过裸 install 顺带升级 git 拉 gettext 网络失败两次的
        # 教训。失败只降级为 warning，继续走下方 fail-closed 明确报错。
        if [ -z "$openssl_prefix" ] || ! command -v pkg-config >/dev/null 2>&1; then
          export HOMEBREW_NO_AUTO_UPDATE=1
          # brew 可执行文件是靠上面的候选列表硬定位的，PATH 未必含其 bin——
          # 自举后 pkg-config 会装到同一目录：当前 step 与后续 step（守卫 +
          # crystal 构建期版本检测）都要能找到，故同时补本 step PATH 与
          # GITHUB_PATH（GITHUB_PATH 对后续 step 是 prepend 语义）。
          brew_bin_dir="$(dirname "$brew_bin")"
          brew_bin_dir_added=0
          case ":$PATH:" in
            *":$brew_bin_dir:"*) ;;
            *) export PATH="$brew_bin_dir:$PATH"; brew_bin_dir_added=1 ;;
          esac
          if [ -z "$openssl_prefix" ]; then
            echo "bootstrapping: brew install openssl@3"
            "$brew_bin" install openssl@3 || echo "::warning::brew install openssl@3 failed; explicit error below if still missing"
          fi
          if ! command -v pkg-config >/dev/null 2>&1; then
            echo "bootstrapping: brew install pkg-config"
            "$brew_bin" install pkg-config || echo "::warning::brew install pkg-config failed; explicit error below if still missing"
          fi
          hash -r
          openssl_prefix="$(scan_kegs || true)"
          # 仅当原 PATH 不含 brew bin 时写入 GITHUB_PATH（与安装结果无关）：
          # 已存在的目录由作业环境继承、保持原优先级，重复前置会让后续
          # step 的 pkg-config 解析到与当前 step 校验不同的可执行文件；
          # 安装失败时守卫仍会 fail-closed，此写入无副作用。
          if [ "$brew_bin_dir_added" -eq 1 ]; then
            echo "$brew_bin_dir" >> "$GITHUB_PATH"
          fi
        fi

        if [ -z "$openssl_prefix" ]; then
          echo "::error::No OpenSSL 3+ keg found (openssl@3 / openssl@4)."
          echo "::error::Install one on the self-hosted runner: brew install openssl@3"
          echo "::error::Note: an unversioned 'openssl' symlink pointing at an old keg (e.g. 1.1) is deliberately not accepted."
          exit 1
        fi

        # pkg-config 是必需项而非可选项：Crystal 用它读取 libcrypto 版本，
        # 缺失时把 LibCrypto::OPENSSL_VERSION 设为 "0.0.0"——CRYSTAL_LIBRARY_PATH
        # 只管链接、不管版本检测。版本被判 < 1.1.0 会让依赖（如 openssl_ext）
        # 走老 API 分支，在编译期报 `undefined method 'ctrl=' for
        # LibCrypto::BioMethod`（main d7d7b3c 的 spec / macos-ci 实测）。
        if ! command -v pkg-config >/dev/null 2>&1; then
          echo "::error::pkg-config not found. Crystal needs it to detect the libcrypto version."
          echo "::error::Install it on the self-hosted runner: brew install pkg-config"
          echo "::error::Without it OPENSSL_VERSION resolves to 0.0.0 and builds fail with 'ctrl=' for LibCrypto::BioMethod."
          exit 1
        fi

        # CRYSTAL_LIBRARY_PATH 优先于 pkg-config，可绕开机器上残留的错误路径。
        {
          echo "CRYSTAL_LIBRARY_PATH=${openssl_prefix}/lib"
          echo "LDFLAGS=-L${openssl_prefix}/lib"
          echo "CPPFLAGS=-I${openssl_prefix}/include"
        } >> "$GITHUB_ENV"

        # pkg-config 搜索路径指向所选 keg（上方已保证 pkg-config 存在），
        # 确保版本检测读到的是该 keg 的 libcrypto，而非机器上其他残留版本。
        if [ -d "${openssl_prefix}/lib/pkgconfig" ]; then
          echo "PKG_CONFIG_PATH=${openssl_prefix}/lib/pkgconfig" >> "$GITHUB_ENV"
        else
          echo "::warning::selected OpenSSL keg has no lib/pkgconfig; version detection may not see it"
        fi

        # 自检：pkg-config 必须解析出【所选 keg 内】的 libcrypto.pc（≥ 3）。
        # PKG_CONFIG_PATH 只增优先目录、不排除默认目录——若所选 keg 缺 .pc
        # 而系统目录有残留元数据，朴素 --modversion 会误判通过。故先要求
        # libcrypto.pc 在所选 keg 内存在，再用 pcfiledir 校验解析来源，
        # 最后验版本，三重确认选中的就是该 keg。
        if [ ! -f "${openssl_prefix}/lib/pkgconfig/libcrypto.pc" ]; then
          echo "::error::${openssl_prefix}/lib/pkgconfig/libcrypto.pc not found."
          echo "::error::Reinstall the keg: brew reinstall openssl@3"
          exit 1
        fi
        detected="$(PKG_CONFIG_PATH="${openssl_prefix}/lib/pkgconfig" pkg-config --modversion libcrypto 2>/dev/null || true)"
        resolved_dir="$(PKG_CONFIG_PATH="${openssl_prefix}/lib/pkgconfig" pkg-config --variable=pcfiledir libcrypto 2>/dev/null || true)"
        if [ -z "$detected" ] || [ "$resolved_dir" != "${openssl_prefix}/lib/pkgconfig" ]; then
          echo "::error::pkg-config resolved libcrypto from '${resolved_dir:-none}', not the selected keg ${openssl_prefix}."
          echo "::error::Check for conflicting PKG_CONFIG_PATH entries."
          exit 1
        fi
        echo "libcrypto version detected by pkg-config: ${detected} (${resolved_dir})"
        case "${detected}" in
          3.*|4.*) ;;
          *)
            echo "::error::libcrypto ${detected} is not OpenSSL 3+; Crystal 1.22 needs 3.x or newer."
            exit 1
            ;;
        esac

        echo "clang: $(clang --version | head -1)"
        echo "openssl: ${openssl_prefix}"
        printf 'sqlite3: '
        sqlite3 --version 2>/dev/null || echo "(CLI missing; system libsqlite3 will still be linked)"

    - name: Set up MSVC environment (Windows)
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      with:
        arch: x64

    - name: Install SQLite3 (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      # Crystal's Windows build targets MSVC, so it needs the `sqlite3.lib` import
      # library plus `sqlite3.dll` at run time. Keep them out of `lib/` (that is the
      # shards directory): the import lib goes to `.build-deps\lib` via LIB, and the
      # DLL lands next to `bin/sebas.exe` so spawned binaries resolve it.
      run: |
        vcpkg install "sqlite3[fts5]:x64-windows"
        $root = $env:VCPKG_INSTALLATION_ROOT
        $deps = "$PWD\.build-deps\lib"
        New-Item -ItemType Directory -Force -Path $deps, "$PWD\bin" | Out-Null
        Copy-Item "$root\installed\x64-windows\lib\sqlite3.lib" "$deps\sqlite3.lib"
        Copy-Item "$root\installed\x64-windows\bin\sqlite3.dll" "$PWD\bin\sqlite3.dll"
        "LIB=$deps;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Append
        "PATH=$deps;$PWD\bin;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Append
