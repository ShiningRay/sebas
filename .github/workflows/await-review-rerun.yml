name: Await review rerun

# 迟到的 review 让门闸重判。
#
# ## 为什么需要这个 workflow
#
# `ci.yml` 的 `await-review` 只在 push / pull_request 上跑，判完即固化。
# 而 CodeRabbit 的 check run 完成与 review 写入之间没有顺序保证：
#
# | PR | head | check run 完成 | review 写入 | 差 |
# |---|---|---|---|---|
# | #280 | `595b54c7` | 10:11:05 | 10:14:15 | +190s |
# | #283 | `0653ae26` | 11:48:19 | 13:13:18 | +5099s |
# | #284 | `e7b1cbd3` | 13:46:15 | 13:39:32 | 早 403s |
#
# 门闸在 check run 完成的那一刻读 review，读到空就放行；等 review 真的写进来，
# 已经没有任何 job 会再看一眼——`spec` / `ameba` 是在门闸**之后**才起跑的，
# 它们不读 review。于是「审查提出了整改项」被静默吞掉，PR 看起来全绿可合并。
#
# ## 只做一件事：重跑一次主 CI
#
# 判定「这条 review 有没有整改项」用 review 正文里的 `Actionable comments posted: N`，
# 与 `tools/await_review.rb` 同一口径（正则首次匹配）；N>0 就重跑该 head 上最近
# 一次 `ci.yml` run，让 `await-review` 在同一个 sha 上重新读一次 review。
#
# 重跑的代价很小：门闸一旦判红，`spec` / `ameba` 会因 needs 失败被 skip，
# 实际只多跑 changes / await-review / docs / verify 四个秒级 job。
#
# ## 安全边界
#
# - `pull_request_review` 的 workflow 定义取自 base 分支，PR 无法改写它；
# - 不 checkout、不执行任何 PR 内文件，只用 `gh api` 读事件与重跑 run；
# - 作者必须等于基线的审查方 login，别人发的 review 不触发任何动作
#   （否则任何人都能伪造一条 `Actionable comments posted: 99` 反复烧 runner，
#   与 CWE-345 同型）；
# - 取 review 正文里**首个**匹配，不取最大值：正文可能引用示例文本；
# - rerun 不产生新的 review 事件，不会自我循环；
# - 任何查询/重跑失败一律降级为 warning：补漏动作不该盖过门闸本身的结论。

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  # 重跑 CI run 需要 actions: write。fork PR 上 GitHub 会把它降为只读，
  # 那种情况下本 job 只打 warning，不失败。
  actions: write
  pull-requests: read

concurrency:
  # 与 ci.yml 的 `ci-<ref>` 分组区分开：这里重跑的是主 CI，不是自己。
  group: await-review-rerun-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  rerun:
    name: await-review-rerun
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 已合并 / 已关闭的 PR 不再重跑：那个 head 上的 pull_request 事件已失效。
    if: |
      github.event.review.user.login == 'coderabbitai[bot]' &&
      github.event.pull_request.state == 'open'
    steps:
      - name: Read actionable count from the review
        id: review
        shell: bash
        env:
          EVENT_PATH: ${{ github.event_path }}
        run: |
          set -euo pipefail

          # 正文走文件而不是 env 变量：review 正文可能很长且含任意字符，
          # 展开进 shell 变量既有长度上限也会引入注入面。
          #
          # 取**首个**匹配，与 tools/await_review.rb 的 ACTIONABLE_PATTERN 同口径。
          # 正文里可能引用示例文本（本仓库的文档与测试就含该文案），取最大值
          # 会把示例当结论；首个值才是审查方自己的判定。
          count="$(jq -r '.review.body // ""' "$EVENT_PATH" \
            | grep -oEm1 'Actionable comments posted:[[:space:]]*[0-9]+' \
            | grep -oE '[0-9]+$' || true)"

          if [ -z "$count" ]; then
            echo "该 review 没有 actionable 文案，无需重判"
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "actionable=${count}"
          echo "count=${count}" >> "$GITHUB_OUTPUT"

      - name: Rerun the review gate on the current head
        if: steps.review.outputs.count != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_PATH: ${{ github.event_path }}
        run: |
          set -euo pipefail

          # 每步都显式兜住失败：`set -e` 下让赋值命令非零退出会直接终止步骤，
          # 后面的 warning 分支根本不会执行，补漏 job 就变红了。
          sha="$(jq -r '.pull_request.head.sha' "$EVENT_PATH" 2>/dev/null || true)"
          if [ -z "$sha" ]; then
            echo "::warning::事件里读不到 head sha，跳过重判"
            exit 0
          fi

          # 取该 head 上最近一次已完成的 pull_request run。
          # **不能假设进行中的 run 会读到这条 review**：门闸 job 早已判完，
          # `spec` / `ameba` 是在它之后才起跑的，矩阵本身不读 review。
          # 只取已完成的：进行中的 run 不允许 rerun（接口 403），而它若还没
          # 跑到门闸，稍后自然会读到这条 review。
          if ! run_id="$(gh api \
            "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$sha&event=pull_request&per_page=20" \
            --jq '[.workflow_runs[] | select(.status == "completed")] | first | .id // ""' 2>/dev/null)"; then
            echo "::warning::查询 $sha 的 CI run 失败，跳过重判"
            exit 0
          fi

          if [ -z "$run_id" ]; then
            echo "::warning::$sha 上没有已完成的 CI run，跳过重判"
            exit 0
          fi

          if gh api -X POST "repos/$REPO/actions/runs/$run_id/rerun" >/dev/null 2>&1; then
            echo "已重跑 CI run $run_id（head $sha），门闸将重新读取 review"
          else
            # 典型原因：fork PR 的 token 只读、run 已被清理。
            # 不失败——重判是补漏，不是门禁本身；让这里红只会淹没真正的门闸结论。
            echo "::warning::重跑 CI run $run_id 失败，需人工确认 $sha 上的 review 是否已处理"
          fi
