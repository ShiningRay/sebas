name: Await review rerun

# 迟到的 review 让门闸重判。
#
# ## 为什么需要这个 workflow
#
# `ci.yml` 的 `await-review` 只在 push / pull_request 上跑，判完即固化。
# 而 CodeRabbit 的 check run 完成与 review 写入之间没有顺序保证：
#
# | PR | head | check run 完成 | review 写入 | 差 |
# |---|---|---|---|---|
# | #280 | `595b54c7` | 10:11:05 | 10:14:15 | +190s |
# | #283 | `0653ae26` | 11:48:19 | 13:13:18 | +5099s |
# | #284 | `e7b1cbd3` | 13:46:15 | 13:39:32 | 早 403s |
#
# 门闸在 check run 完成的那一刻读 review，读到空就放行；等 review 真的写进来，
# 已经没有任何 job 会再看一眼——`spec` / `ameba` 是在门闸**之后**才起跑的，
# 它们不读 review。于是「审查提出了整改项」被静默吞掉，PR 看起来全绿可合并。
#
# ## 只做一件事：重跑一次主 CI
#
# 判定「这条 review 有没有整改项」用 review 正文里的 `Actionable comments posted: N`，
# 与 `tools/await_review.rb` 同一口径（正则首次匹配）；N>0 就重跑该 head 上最近
# 一次 `ci.yml` run，让 `await-review` 在同一个 sha 上重新读一次 review。
#
# 重跑的代价很小：门闸一旦判红，`spec` / `ameba` 会因 needs 失败被 skip，
# 实际只多跑 changes / await-review / docs / verify 四个秒级 job。
#
# ## 安全边界
#
# - `pull_request_review` 的 workflow 定义取自 base 分支，PR 无法改写它；
# - 不 checkout、不执行任何 PR 内文件，只用 `gh api` 读事件与重跑 run；
# - 作者必须等于基线的审查方 login，别人发的 review 不触发任何动作
#   （否则任何人都能伪造一条 `Actionable comments posted: 99` 反复烧 runner，
#   与 CWE-345 同型）；
# - 取 review 正文里**首个**匹配，不取最大值：正文可能引用示例文本；
#   用 `head -n1` 而非 `grep -m1`——后者限行不限匹配，同一行两个标记会输出两行，
#   写进 $GITHUB_OUTPUT 就是多行值，步骤红掉；
# - 只在「门闸完成时刻早于 review 提交时刻」时重跑，其余情形视为已读到；
# - 只有进行中的 run 时有界等待（最多 150s），等不到交人工；
# - 同一 run 的重跑上限按 run_attempt 记（>=3 停手），防空转；
# - rerun 不产生新的 review 事件，不会自我循环；
# - 任何查询/重跑失败一律降级为 warning：补漏动作不该盖过门闸本身的结论。

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  # 重跑 CI run 需要 actions: write。fork PR 上 GitHub 会把它降为只读，
  # 那种情况下本 job 只打 warning，不失败。
  actions: write
  pull-requests: read

concurrency:
  # 与 ci.yml 的 `ci-<ref>` 分组区分开：这里重跑的是主 CI，不是自己。
  group: await-review-rerun-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  rerun:
    name: await-review-rerun
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 已合并 / 已关闭的 PR 不再重跑：那个 head 上的 pull_request 事件已失效。
    if: |
      github.event.review.user.login == 'coderabbitai[bot]' &&
      github.event.pull_request.state == 'open'
    steps:
      - name: Read actionable count from the review
        id: review
        shell: bash
        env:
          EVENT_PATH: ${{ github.event_path }}
        run: |
          set -euo pipefail

          # 正文走文件而不是 env 变量：review 正文可能很长且含任意字符，
          # 展开进 shell 变量既有长度上限也会引入注入面。
          #
          # 取**首个**匹配，与 tools/await_review.rb 的 ACTIONABLE_PATTERN 同口径。
          # 正文里可能引用示例文本（本仓库的文档与测试就含该文案），首个值才是
          # 审查方自己的判定。
          #
          # `head -n1` 不可省：grep 的 -m1 限的是**行数**，同一行出现两个标记时
          # 两行都会输出（实测）。多了那一行，后面 `echo "count=..." >> $GITHUB_OUTPUT`
          # 就是多行值，GitHub 解析失败，整个步骤红掉。
          # `tr -cd '0-9'` 只留数字，避免再依赖一次正则的收尾形状。
          count="$(jq -r '.review.body // ""' "$EVENT_PATH" \
            | grep -oE 'Actionable comments posted:[[:space:]]*[0-9]+' \
            | head -n1 \
            | tr -cd '0-9' || true)"

          if [ -z "$count" ]; then
            echo "该 review 没有 actionable 文案，无需重判"
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "actionable=${count}"
          echo "count=${count}" >> "$GITHUB_OUTPUT"

      - name: Rerun the review gate on the current head
        if: steps.review.outputs.count != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_PATH: ${{ github.event_path }}
        run: |
          set -euo pipefail

          # 每步都显式兜住失败：`set -e` 下让赋值命令非零退出会直接终止步骤，
          # 后面的 warning 分支根本不会执行，补漏 job 就变红了。
          sha="$(jq -r '.pull_request.head.sha' "$EVENT_PATH" 2>/dev/null || true)"
          submitted="$(jq -r '.review.submitted_at // ""' "$EVENT_PATH" 2>/dev/null || true)"
          if [ -z "$sha" ]; then
            echo "::warning::事件里读不到 head sha，跳过重判"
            exit 0
          fi

          # 列出该 head 上的 ci.yml pull_request run。
          # **不能假设进行中的 run 会读到这条 review**：门闸 job 可能早已判完，
          # `spec` / `ameba` 是在它之后才起跑的，矩阵本身不读 review。
          if ! listing="$(gh api \
            "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$sha&event=pull_request&per_page=20" \
            --jq '.workflow_runs[] | "\(.id) \(.status) \(.run_attempt)"' 2>/dev/null)"; then
            echo "::warning::查询 $sha 的 CI run 失败，跳过重判"
            exit 0
          fi

          completed_id="$(printf '%s\n' "$listing" | awk '$2 == "completed" { print $1; exit }')"
          running_id="$(printf '%s\n' "$listing" | awk '$2 != "completed" { print $1; exit }')"

          # 只有进行中的 run：有界等待它结束。直接跳过的代价是这一轮 review
          # 无人重判；而它若确实还没跑到门闸，稍后自然会读到——这两种可能
          # 只能等它结束再分辨。等不到就 warning 交人工，不含糊放行。
          if [ -z "$completed_id" ] && [ -n "$running_id" ]; then
            echo "该 head 只有进行中的 run ${running_id}，等它结束（最多 150s）"
            state="unknown"
            for _ in $(seq 1 30); do
              state="$(gh api "repos/$REPO/actions/runs/$running_id" \
                --jq '.status' 2>/dev/null || true)"
              [ "$state" = "completed" ] && break
              sleep 5
            done
            if [ "$state" != "completed" ]; then
              echo "::warning::run $running_id 在等待窗口内未完成，需人工确认 $sha 上的 review 已被读到"
              exit 0
            fi
            completed_id="$running_id"
          fi

          if [ -z "$completed_id" ]; then
            echo "::warning::$sha 上没有 CI run，跳过重判"
            exit 0
          fi

          # 判据要比的是**门闸读取 review 的时刻**，而 job 的 completed_at 比它晚，
          # 不能当作「读过了」的凭据（CodeRabbit 在 PR #288 指出）。设 job 区间
          # [started_at, completed_at]，读取发生在区间内某点 F：
          #
          # - review 提交时刻 <= started_at：F 必然晚于提交 => 读到了，不重跑；
          # - 提交发生在 (started_at, completed_at] 内：F 可能在提交之前（读到的是
          #   空列表）也可能之后，**不确定，保守重跑**；
          # - 提交晚于 completed_at：F 必然更早 => 没读到，重跑。
          #
          # 没有 started_at（还排队）时下一步会等它跑；取不到时刻则按「不确定」
          # 处理，宁可多烧一轮也不让整改意见被静默吞掉——上限会兜住。
          started_at="$(gh api "repos/$REPO/actions/runs/$completed_id/jobs?per_page=100" \
            --jq '[.jobs[] | select(.name == "await-review") | .started_at // empty] | first // ""' 2>/dev/null || true)"
          gate_done="$(gh api "repos/$REPO/actions/runs/$completed_id/jobs?per_page=100" \
            --jq '[.jobs[] | select(.name == "await-review") | .completed_at // empty] | first // ""' 2>/dev/null || true)"

          if [ -z "$submitted" ]; then
            echo "::warning::事件里读不到 review 提交时刻，无法判定是否读过，需人工确认 $sha"
            exit 0
          fi
          if [ -z "$started_at" ]; then
            echo "::warning::查不到 $completed_id 里 await-review 的启动时刻，按未读处理（保守重跑）"
          elif [[ ! "$submitted" > "$started_at" ]]; then
            # ISO8601 UTC 定长格式，字符串比较等价于时间比较。
            echo "review ${submitted} 不晚于门闸启动 ${started_at}，必然读到，不重跑"
            exit 0
          fi
          echo "review ${submitted} 落在门闸读取不确定窗口内（门闸结束 ${gate_done:-未知}），重判"

          # 防循环：rerun 不产生新的 review 事件，正常不会自循环。上限按
          # run_attempt 记（首次运行为 1，每 rerun 一次加 1），第 3 次起停手。
          # attempt 单独查：走过等待分支时 listing 是等待前的快照，已过期。
          # 查询失败或字段缺失时**不默认成 1**——那会让上限形同虚设，
          # 直接交人工（CodeRabbit 在 PR #288 第 3 轮指出）。
          attempt="$(gh api "repos/$REPO/actions/runs/$completed_id" \
            --jq '.run_attempt' 2>/dev/null || true)"
          if ! [[ "$attempt" =~ ^[0-9]+$ ]]; then
            echo "::warning::查不到 $completed_id 的 run_attempt（得到「${attempt}」），无法防循环，需人工确认 $sha"
            exit 0
          fi
          if [ "$attempt" -ge 3 ]; then
            echo "::warning::run $completed_id 已是第 ${attempt} 次运行，不再自动重跑，需人工确认 $sha"
            exit 0
          fi

          if gh api -X POST "repos/$REPO/actions/runs/$completed_id/rerun" >/dev/null 2>&1; then
            echo "已重跑 CI run ${completed_id}（head ${sha}），门闸将重新读取 review"
          else
            # 典型原因：fork PR 的 token 只读、run 已被清理。
            # 不失败——重判是补漏，不是门禁本身；让这里红只会淹没真正的门闸结论。
            echo "::warning::重跑 CI run $completed_id 失败，需人工确认 $sha 上的 review 是否已处理"
          fi
