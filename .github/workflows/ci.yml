name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 并发分组：组名沿用 ci-<ref>——PR 事件的 ref 是 refs/pull/<n>/merge，
# push:main 与 workflow_dispatch 都是 refs/heads/main，天然分属两组，
# 所以组名不需要按事件改写。
#
# 要改的是取消语义：
#   1. PR 侧必须取消。门闸最长等 15 分钟，同一 PR 的新推送不取消旧轮，
#      队列会堆积大量空等。
#   2. main 侧不能取消。`evidence-register.yml` 只在 CI 结论为 success 时把
#      Evidence 升级为 merged_into_main=true（`resolve_checks_url` 还要求触发的
#      提交就是 merge commit）。下一次 push 顶掉正在跑的 main CI，那一轮的
#      Evidence 就停在 false，后继卡永久 blocked。2026-11-27 实测 main 侧
#      100 次 run 有 5 次 cancelled，其中 2 次是已跑 30 / 53 分钟后被下一次
#      push 顶掉；合并队列上线后 main push 变密集，这个比例会放大。
#
# 边界（必须知道）：GitHub 每个并发组只保留一个 running + 一个 pending，
# 第三个进入时 pending 会被替换。所以本改动只保证「合并队列串行时的每张卡
# 都能拿到成功 CI」，不保证绕过队列的连续人工合并不丢 Evidence——那要靠
# 合并队列的串行单位（等 Evidence 升级完再合下一张）。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 分支保护要求 spec / ameba 四项始终报告状态，所以这些 job 不整体跳过，
  # 而是在内部判断「本次改动是否影响构建或测试」，纯文档改动直接成功返回。
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect build-relevant changes
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_AFTER: ${{ github.event.after }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          # 手动触发一律跑完整门禁。
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 基线：PR 用 merge-base 三点比较；push 比较前后两个快照（两点）。
          # push 若用三点，强推回退会因 merge-base 落在旧提交上而误报「无改动」。
          base=""
          range_args=()
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
            range_args=("${base}...${EVENT_AFTER}")
          elif [ "$EVENT_NAME" = "push" ]; then
            # 新建分支/强推时 before 为全 0，没有可比较的基线。
            case "$EVENT_BEFORE" in
              0000000000000000000000000000000000000000) base="" ;;
              *) base="$EVENT_BEFORE" ;;
            esac
            range_args=("$base" "$EVENT_AFTER")
          fi

          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "No usable diff base ($base); running the full gate."
            exit 0
          fi

          # -z 关闭路径引号转义：中文/空格文件名默认会被 quotePath 转义成带引号的
          # 转义串，锚定正则就匹配不上。--no-renames 让改名同时报告旧、新两个路径，
          # src/ 被搬走或移出时也不会漏判。
          changed=$(git diff --name-only -z --no-renames "${range_args[@]}" | tr '\0' '\n')

          # 影响编译、测试或 CI 行为的路径。docs/、*.md、LICENSE 与
          # examples/ 下的插件示例都不参与构建，因此纯文档改动会跳过门禁。
          build_relevant='^(src/|spec/|\.github/|shard\.yml|shard\.lock|Makefile|\.ameba\.yml|\.editorconfig|\.gitattributes|\.gitignore)'

          # 用 here-string 而非管道：`printf | grep -q` 在 pipefail 下，grep 提前
          # 退出会让 printf 收到 SIGPIPE，整条管道返回 141，反而把「命中」判成未命中。
          if grep -qE "$build_relevant" <<< "$changed"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

          echo "Changed files:" && printf '%s\n' "$changed"

  # 「先 review，再跑 CI」的门闸：审查没跑完不跑矩阵；审查提出整改项也不跑。
  #
  # 动机：原先 CodeRabbit 与矩阵并行，矩阵 1-2 分钟就绿、审查要 5-7 分钟
  # （实测 PR #230/#231/#237/#238），实现方按绿灯推进、收到意见再推 commit，
  # 一整轮三平台白烧。更糟的是先跑完才发现要改，等于把 runner 烧在废稿上。
  #
  # 判定逻辑见 tools/await_review.rb。本 job 现在是**真判定**：脚本返回非 0
  # 时 job 红，下游 spec / ameba 不跑。
  #
  # 为什么敢让它红（此前口径正相反）：GitHub 文档写明「依赖失败 job 的 job 会
  # 被 skipped 且可能不阻塞合并」。所以只有把 await-review 本身加进分支保护的
  # 必检清单，skip 才不会变成「放行」。仓库已把它设为必检（见
  # docs/design/process/development-workflow.md §4 的必检 contexts）。
  # 若这道必检被移除，请同时把下面的 continue-on-error 改回 true——
  # 否则矩阵被 skip 而 PR 仍可能合入，等于绕过 spec/ameba。
  #
  # 非 PR 事件（push:main / workflow_dispatch）没有待审对象，job 直接成功：
  # 这里不能用 job-level `if` 跳过，needs 视 skipped 为不满足，下游会跟着 skip。
  await-review:
    name: await-review
    runs-on: ubuntu-latest
    # 同 job 内的等待步骤还有自己的 timeout-minutes（16min），这里留 4 分钟
    # 给 checkout / Ruby 选择 / 收尾。两层超时都必要：步骤超时管「脚本挂住」，
    # job 超时管「步骤声明缺失或 checkout 卡住」。
    timeout-minutes: 20
    permissions:
      contents: read
      checks: read
      # 整改清单评论要写在 PR 上；只在判定出问题时用。
      pull-requests: write
      issues: write
    steps:
      - name: Not a pull request
        if: github.event_name != 'pull_request'
        run: echo "非 PR 事件，无需等待审查"

      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # 与 docs / verify 同口径：tools/** 的解释器统一取自 .ruby-version，
      # 不用镜像默认 ruby（可能低于下限）。这一段在 ci.yml 内重复出现，
      # 刻意不抽 composite action——它是门闸的启动路径，少一层间接更好查。
      - name: Select preinstalled Ruby
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          want="$(cat .ruby-version)"
          want_minor="$(echo "$want" | cut -d. -f1-2)"
          ge() { printf '%s\n%s\n' "$2" "$1" | sort -V -C; }

          best=""
          for dir in /opt/hostedtoolcache/Ruby/*/x64; do
            [ -x "$dir/bin/ruby" ] || continue
            version="$("$dir/bin/ruby" -e 'print RUBY_VERSION')"
            ge "$version" "$want_minor" || continue
            if [ -z "$best" ] || ge "$version" "$best_version"; then
              best="$dir"; best_version="$version"
            fi
          done

          if [ -z "$best" ]; then
            echo "::error::镜像未预装 Ruby >= $want_minor（pin $want），门闸无法判定"
            exit 1
          fi
          echo "$best/bin" >> "$GITHUB_PATH"
          echo "selected Ruby $best_version from $best"

      - name: Await review on the head commit
        if: github.event_name == 'pull_request'
        # 脚本自己会 fail-open，但它只在两次轮询之间检查 deadline，
        # 拦不住一次挂住的 gh 调用。步骤级超时兜住这种情形：超时被杀
        # 算 job 失败，但那时 gh 已经挂死，宁可让门闸红一次也不占着队列。
        timeout-minutes: 16
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ruby tools/await_review.rb

  # 公开仓库的信任边界：PR 的 workflow 定义来自 PR 的 merge commit，贡献者可以改写它，
  # 所以 pull_request 事件一律用 GitHub 托管的 macos-latest。只有 push:main、tag、
  # workflow_dispatch 这类可信任 ref 才落到 self-hosted 的 macos-ci 上（那台机器上有
  # 本机凭据、家目录与内网访问）。分支保护的必需检查名取自 matrix.runner，PR 上仍是
  # "spec / macos-latest"。
  spec:
    name: spec / ${{ matrix.runner }}
    # 等审查收尾再起三平台矩阵。docs / verify 不在此列：它们数秒完成，
    # 先给文档与锚点的反馈比排队等审查更有用。
    needs: [changes, await-review]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
          - runner: ${{ github.event_name == 'pull_request' && 'macos-latest' || 'macos-ci' }}
          - runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Skip (documentation-only change)
        if: needs.changes.outputs.code != 'true'
        run: echo "No build-relevant changes; skipping specs."

      - name: Setup toolchain
        if: needs.changes.outputs.code == 'true'
        uses: ./.github/actions/setup

      - name: Cache shards
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            lib
            ~/.cache/shards
          key: shards-${{ runner.os }}-${{ hashFiles('shard.yml', 'shard.lock') }}
          restore-keys: shards-${{ runner.os }}-

      - name: Install shards
        if: needs.changes.outputs.code == 'true'
        run: shards install --frozen

      - name: Format check
        if: needs.changes.outputs.code == 'true'
        run: crystal tool format --check

      - name: Spec
        if: needs.changes.outputs.code == 'true'
        run: crystal spec --no-color

  lint:
    name: ameba
    needs: [changes, await-review]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Skip (documentation-only change)
        if: needs.changes.outputs.code != 'true'
        run: echo "No build-relevant changes; skipping lint."

      - name: Setup toolchain
        if: needs.changes.outputs.code == 'true'
        uses: ./.github/actions/setup

      - name: Cache shards
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            lib
            ~/.cache/shards
          key: shards-${{ runner.os }}-${{ hashFiles('shard.yml', 'shard.lock') }}
          restore-keys: shards-${{ runner.os }}-

      - name: Install shards
        if: needs.changes.outputs.code == 'true'
        run: shards install --frozen

      - name: Lint
        if: needs.changes.outputs.code == 'true'
        run: make lint

  # 文档自检：死链、失效行号锚、单文件体量。不依赖 changes——纯文档改动恰恰是
  # 它唯一要拦的场景，走 skip 就成了空门。脚本只用 Ruby 标准库。
  # 镜像默认 ruby 可能低于 .ruby-version 的要求；镜像预装了多个 Ruby（如 3.4.12），
  # 直接从工具缓存切换，不引入第三方 action（本仓库 Actions 有白名单 + 强制 SHA 钉版）。
  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # .ruby-version 里的补丁版可能比镜像预装的更新（如 3.4.13 vs 3.4.12）。
      # 同一 minor 内功能等价，选镜像里满足下限的最高版本即可，不联网装解释器。
      - name: Select preinstalled Ruby
        shell: bash
        run: |
          want="$(cat .ruby-version)"
          want_minor="$(echo "$want" | cut -d. -f1-2)"
          # 版本 a >= 下限 b 时 sort -V -C 退出 0
          ge() { printf '%s\n%s\n' "$2" "$1" | sort -V -C; }

          best=""
          for dir in /opt/hostedtoolcache/Ruby/*/x64; do
            [ -x "$dir/bin/ruby" ] || continue
            version="$("$dir/bin/ruby" -e 'print RUBY_VERSION')"
            ge "$version" "$want_minor" || continue
            if [ -z "$best" ] || ge "$version" "$best_version"; then
              best="$dir"; best_version="$version"
            fi
          done

          if [ -z "$best" ]; then
            echo "::error::镜像未预装 Ruby >= $want_minor（pin $want）"
            ls /opt/hostedtoolcache/Ruby/ || true
            exit 1
          fi
          echo "$best/bin" >> "$GITHUB_PATH"
          echo "selected Ruby $best_version from $best"

      - name: Verify Ruby meets the pin
        shell: bash
        run: |
          want="$(cat .ruby-version)"; want_minor="$(echo "$want" | cut -d. -f1-2)"
          have="$(ruby -e 'print RUBY_VERSION')"
          printf '%s\n%s\n' "$want_minor" "$have" | sort -V -C \
            || { echo "::error::已装 Ruby $have，低于 .ruby-version 要求的 $want_minor"; exit 1; }
          echo "Ruby $have ok（pin $want）"

      # docs 域：check_docs 的锚点/体量回归 + 文档示例一致性。
      - name: Test the docs checker itself
        run: ruby tools/tests/run.rb docs

      - name: Check docs links, anchors and size
        run: ruby tools/check_docs.rb

      # Proposal 文档只能由 Maintainer/Scribe 一方提交（proposal-lifecycle.md §7）。
      # 外部贡献与普通协作者只能开 issue 参与讨论。仅在 PR 上校验；
      # 白名单取自 .github/agents.yml 的 maintainers，读不到即 fail-closed。
      - name: Check proposal document authorship
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ruby tools/check_proposal_paths.rb

      # 测试清单由 tools/tests/ 目录推导，新增文件不必同步改这里。
      # workflows 域留在 verify job 跑（与 verify.yml 契约测试同批），避免重复执行；
      # legacy 域兜住尚未迁移的 tools/test_*.rb，防并行合流的新测试静默失跑。
      - name: Test agent process tools
        run: ruby tools/tests/run.rb docs evidence legacy process sebas_process

      - name: Smoke test agent CLI
        run: |
          ruby tools/sebas-process version
          ruby tools/sebas-process roles --one-line
          ruby tools/sebas-process help

  # 确定性核验（#121）：把「文档声称的锚点」变成可机器核验的断言。
  #
  # 与 docs job 的分工（避免重复报告同一问题）：
  #   check_docs.rb —— 死链、行号锚（design.md:L<n> 形态）、体量三项（物理行/等效屏幕行/单行宽度）。
  #   本 job        —— 额外核验 docs 里 `src/x.cr:123` 形态引用的内容是否真的
  #                    与源码一致、行号是否越界。这是 check_docs.rb 没覆盖的。
  #
  # 与 changes job 无关：纯文档改动恰恰是它唯一要拦的场景，不能走 skip。
  # 生成物不入库：anchors.json 是派生物，在 CI 里即时生成后核验。
  # 范围限定 docs/：verify docs 的行号锚正则会命中 CONTRIBUTING.md 里
  # 讲解规则本身的那句示例（`design.md:L749`-style），那不是真锚点。
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Select preinstalled Ruby
        shell: bash
        run: |
          want="$(cat .ruby-version)"
          want_minor="$(echo "$want" | cut -d. -f1-2)"
          ge() { printf '%s\n%s\n' "$2" "$1" | sort -V -C; }

          best=""
          for dir in /opt/hostedtoolcache/Ruby/*/x64; do
            [ -x "$dir/bin/ruby" ] || continue
            version="$("$dir/bin/ruby" -e 'print RUBY_VERSION')"
            ge "$version" "$want_minor" || continue
            if [ -z "$best" ] || ge "$version" "$best_version"; then
              best="$dir"; best_version="$version"
            fi
          done

          if [ -z "$best" ]; then
            echo "::error::镜像未预装 Ruby >= $want_minor（pin $want）"
            ls /opt/hostedtoolcache/Ruby/ || true
            exit 1
          fi
          echo "$best/bin" >> "$GITHUB_PATH"
          echo "selected Ruby $best_version from $best"

      # workflows 域：锚点抽取器 + verify.yml 契约 + setup action + coderabbit 配置。
      # verify.yml 的安全属性（脚本取自 base）靠这里固定：若有人把 base.sha 改成
      # head.sha，仅靠人工 review 很容易漏过。
      - name: Test the PR verify workflow and contract tests
        run: ruby tools/tests/run.rb workflows

      # 全量 docs 跑 verify docs：不限改动文件，防止旧文档劣化。
      # acceptable 级（存档行号锚）不算失败；blocker/must_fix 让退出码非 0。
      - name: Verify docs gate
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files 'docs/**/*.md')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::docs/ 下没有 markdown 文件，核验无对象"
            exit 1
          fi
          ruby tools/sebas-process verify docs "${files[@]}"

      - name: Verify doc code anchors against source
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files 'docs/**/*.md')
          ruby tools/anchors_extract.rb --output /tmp/anchors.json "${files[@]}"
          ruby tools/sebas-process verify anchors /tmp/anchors.json

  # 三平台 release 构建成本最高，只在 main 与手动触发时跑；PR 由 spec 覆盖
  # 编译正确性。下面的 if 保证 PR 不会进入这里，因此 macOS 直接走 self-hosted。
  release-build:
    name: release build / ${{ matrix.runner }}
    needs: [changes, spec]
    if: needs.changes.outputs.code == 'true' && github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
          - runner: macos-ci
          - runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Cache shards
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            lib
            ~/.cache/shards
          key: shards-${{ runner.os }}-${{ hashFiles('shard.yml', 'shard.lock') }}
          restore-keys: shards-${{ runner.os }}-

      - name: Install shards
        run: shards install --frozen

      - name: Create output directory
        shell: bash
        run: mkdir -p bin

      # --error-trace 只影响失败时的输出详细度（#308：runner 环境特有的
      # 编译期错误曾因只报「最后一帧」无法定位，加它换取失败即全链可读）；
      # 成功构建输出不变。
      - name: Build release binary
        run: crystal build --release --no-debug --error-trace -o bin/sebas src/main.cr

      - name: Smoke test
        shell: bash
        run: |
          bin="./bin/sebas"
          [ "${RUNNER_OS:-}" = "Windows" ] && bin="./bin/sebas.exe"
          "$bin" version

      - name: Crash-recovery drill (M0-WP8)
        run: crystal spec spec/platform/cli/gateway_spec.cr --no-color
