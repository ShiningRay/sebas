name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 分支保护要求 spec / ameba 四项始终报告状态，所以这些 job 不整体跳过，
  # 而是在内部判断「本次改动是否影响构建或测试」，纯文档改动直接成功返回。
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.detect.outputs.code }}
      macos_runner: ${{ steps.runner.outputs.macos_runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # 仓库是公开的：fork 的代码绝不能在我们自己的 self-hosted 机器上执行
      # （runner 能读文件系统、凭据，也能访问内网）。fork PR 回退到 GitHub
      # 托管 runner；本仓分支与 main 的 push 才用 self-hosted。
      - name: Pick the macOS runner
        id: runner
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$PR_HEAD_REPO" ] && [ "$PR_HEAD_REPO" != "$REPO" ]; then
            echo "macos_runner=macos-latest" >> "$GITHUB_OUTPUT"
            echo "Fork PR from ${PR_HEAD_REPO} -> hosted macos-latest."
          else
            echo "macos_runner=macos-ci" >> "$GITHUB_OUTPUT"
            echo "First-party run -> self-hosted macOS runner."
          fi

      - name: Detect build-relevant changes
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_AFTER: ${{ github.event.after }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          # 手动触发一律跑完整门禁。
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 基线：PR 用 merge-base 三点比较；push 比较前后两个快照（两点）。
          # push 若用三点，强推回退会因 merge-base 落在旧提交上而误报「无改动」。
          base=""
          range_args=()
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
            range_args=("${base}...${EVENT_AFTER}")
          elif [ "$EVENT_NAME" = "push" ]; then
            # 新建分支/强推时 before 为全 0，没有可比较的基线。
            case "$EVENT_BEFORE" in
              0000000000000000000000000000000000000000) base="" ;;
              *) base="$EVENT_BEFORE" ;;
            esac
            range_args=("$base" "$EVENT_AFTER")
          fi

          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "No usable diff base ($base); running the full gate."
            exit 0
          fi

          # -z 关闭路径引号转义：中文/空格文件名默认会被 quotePath 转义成带引号的
          # 转义串，锚定正则就匹配不上。--no-renames 让改名同时报告旧、新两个路径，
          # src/ 被搬走或移出时也不会漏判。
          changed=$(git diff --name-only -z --no-renames "${range_args[@]}" | tr '\0' '\n')

          # 影响编译、测试或 CI 行为的路径。docs/、*.md、LICENSE 与
          # examples/ 下的插件示例都不参与构建，因此纯文档改动会跳过门禁。
          build_relevant='^(src/|spec/|\.github/|shard\.yml|shard\.lock|Makefile|\.ameba\.yml|\.editorconfig|\.gitattributes|\.gitignore)'

          # 用 here-string 而非管道：`printf | grep -q` 在 pipefail 下，grep 提前
          # 退出会让 printf 收到 SIGPIPE，整条管道返回 141，反而把「命中」判成未命中。
          if grep -qE "$build_relevant" <<< "$changed"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

          echo "Changed files:" && printf '%s\n' "$changed"

  spec:
    name: spec / ${{ matrix.os }}
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runner: ubuntu-latest
          - os: macos-latest
            runner: ${{ needs.changes.outputs.macos_runner }}
          - os: windows-latest
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Skip (documentation-only change)
        if: needs.changes.outputs.code != 'true'
        run: echo "No build-relevant changes; skipping specs."

      - name: Setup toolchain
        if: needs.changes.outputs.code == 'true'
        uses: ./.github/actions/setup

      - name: Cache shards
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@v4
        with:
          path: |
            lib
            ~/.cache/shards
          key: shards-${{ runner.os }}-${{ hashFiles('shard.yml', 'shard.lock') }}
          restore-keys: shards-${{ runner.os }}-

      - name: Install shards
        if: needs.changes.outputs.code == 'true'
        run: shards install --frozen

      - name: Format check
        if: needs.changes.outputs.code == 'true'
        run: crystal tool format --check

      - name: Spec
        if: needs.changes.outputs.code == 'true'
        run: crystal spec --no-color

  lint:
    name: ameba
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Skip (documentation-only change)
        if: needs.changes.outputs.code != 'true'
        run: echo "No build-relevant changes; skipping lint."

      - name: Setup toolchain
        if: needs.changes.outputs.code == 'true'
        uses: ./.github/actions/setup

      - name: Cache shards
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@v4
        with:
          path: |
            lib
            ~/.cache/shards
          key: shards-${{ runner.os }}-${{ hashFiles('shard.yml', 'shard.lock') }}
          restore-keys: shards-${{ runner.os }}-

      - name: Install shards
        if: needs.changes.outputs.code == 'true'
        run: shards install --frozen

      - name: Lint
        if: needs.changes.outputs.code == 'true'
        run: make lint

  # 三平台 release 构建成本最高，只在 main 与手动触发时跑；PR 由 spec 覆盖
  # 编译正确性。macOS 用 self-hosted（本仓 push 一律由本仓维护者触发）。
  release-build:
    name: release build / ${{ matrix.os }}
    needs: [changes, spec]
    if: needs.changes.outputs.code == 'true' && github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runner: ubuntu-latest
          - os: macos-latest
            runner: ${{ needs.changes.outputs.macos_runner }}
          - os: windows-latest
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Cache shards
        uses: actions/cache@v4
        with:
          path: |
            lib
            ~/.cache/shards
          key: shards-${{ runner.os }}-${{ hashFiles('shard.yml', 'shard.lock') }}
          restore-keys: shards-${{ runner.os }}-

      - name: Install shards
        run: shards install --frozen

      - name: Create output directory
        shell: bash
        run: mkdir -p bin

      - name: Build release binary
        run: crystal build --release --no-debug -o bin/sebas src/main.cr

      - name: Smoke test
        shell: bash
        run: |
          bin="./bin/sebas"
          [ "${RUNNER_OS:-}" = "Windows" ] && bin="./bin/sebas.exe"
          "$bin" version

      - name: Crash-recovery drill (M0-WP8)
        run: crystal spec spec/platform/cli/gateway_spec.cr --no-color
