name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 分支保护要求 spec / ameba 四项始终报告状态，所以这些 job 不整体跳过，
  # 而是在内部判断「本次改动是否影响构建或测试」，纯文档改动直接成功返回。
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect build-relevant changes
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_AFTER: ${{ github.event.after }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          # 手动触发一律跑完整门禁。
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 基线：PR 用 merge-base 三点比较；push 比较前后两个快照（两点）。
          # push 若用三点，强推回退会因 merge-base 落在旧提交上而误报「无改动」。
          base=""
          range_args=()
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
            range_args=("${base}...${EVENT_AFTER}")
          elif [ "$EVENT_NAME" = "push" ]; then
            # 新建分支/强推时 before 为全 0，没有可比较的基线。
            case "$EVENT_BEFORE" in
              0000000000000000000000000000000000000000) base="" ;;
              *) base="$EVENT_BEFORE" ;;
            esac
            range_args=("$base" "$EVENT_AFTER")
          fi

          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "No usable diff base ($base); running the full gate."
            exit 0
          fi

          # -z 关闭路径引号转义：中文/空格文件名默认会被 quotePath 转义成带引号的
          # 转义串，锚定正则就匹配不上。--no-renames 让改名同时报告旧、新两个路径，
          # src/ 被搬走或移出时也不会漏判。
          changed=$(git diff --name-only -z --no-renames "${range_args[@]}" | tr '\0' '\n')

          # 影响编译、测试或 CI 行为的路径。docs/、*.md、LICENSE 与
          # examples/ 下的插件示例都不参与构建，因此纯文档改动会跳过门禁。
          build_relevant='^(src/|spec/|\.github/|shard\.yml|shard\.lock|Makefile|\.ameba\.yml|\.editorconfig|\.gitattributes|\.gitignore)'

          # 用 here-string 而非管道：`printf | grep -q` 在 pipefail 下，grep 提前
          # 退出会让 printf 收到 SIGPIPE，整条管道返回 141，反而把「命中」判成未命中。
          if grep -qE "$build_relevant" <<< "$changed"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

          echo "Changed files:" && printf '%s\n' "$changed"

  # 公开仓库的信任边界：PR 的 workflow 定义来自 PR 的 merge commit，贡献者可以改写它，
  # 所以 pull_request 事件一律用 GitHub 托管的 macos-latest。只有 push:main、tag、
  # workflow_dispatch 这类可信任 ref 才落到 self-hosted 的 macos-ci 上（那台机器上有
  # 本机凭据、家目录与内网访问）。分支保护的必需检查名取自 matrix.runner，PR 上仍是
  # "spec / macos-latest"。
  spec:
    name: spec / ${{ matrix.runner }}
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
          - runner: ${{ github.event_name == 'pull_request' && 'macos-latest' || 'macos-ci' }}
          - runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Skip (documentation-only change)
        if: needs.changes.outputs.code != 'true'
        run: echo "No build-relevant changes; skipping specs."

      - name: Setup toolchain
        if: needs.changes.outputs.code == 'true'
        uses: ./.github/actions/setup

      - name: Cache shards
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            lib
            ~/.cache/shards
          key: shards-${{ runner.os }}-${{ hashFiles('shard.yml', 'shard.lock') }}
          restore-keys: shards-${{ runner.os }}-

      - name: Install shards
        if: needs.changes.outputs.code == 'true'
        run: shards install --frozen

      - name: Format check
        if: needs.changes.outputs.code == 'true'
        run: crystal tool format --check

      - name: Spec
        if: needs.changes.outputs.code == 'true'
        run: crystal spec --no-color

  lint:
    name: ameba
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Skip (documentation-only change)
        if: needs.changes.outputs.code != 'true'
        run: echo "No build-relevant changes; skipping lint."

      - name: Setup toolchain
        if: needs.changes.outputs.code == 'true'
        uses: ./.github/actions/setup

      - name: Cache shards
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            lib
            ~/.cache/shards
          key: shards-${{ runner.os }}-${{ hashFiles('shard.yml', 'shard.lock') }}
          restore-keys: shards-${{ runner.os }}-

      - name: Install shards
        if: needs.changes.outputs.code == 'true'
        run: shards install --frozen

      - name: Lint
        if: needs.changes.outputs.code == 'true'
        run: make lint

  # 文档自检：死链、失效行号锚、单文件体量。不依赖 changes——纯文档改动恰恰是
  # 它唯一要拦的场景，走 skip 就成了空门。脚本只用 Ruby 标准库。
  # 镜像默认 ruby 可能低于 .ruby-version 的要求；镜像预装了多个 Ruby（如 3.4.12），
  # 直接从工具缓存切换，不引入第三方 action（本仓库 Actions 有白名单 + 强制 SHA 钉版）。
  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # .ruby-version 里的补丁版可能比镜像预装的更新（如 3.4.13 vs 3.4.12）。
      # 同一 minor 内功能等价，选镜像里满足下限的最高版本即可，不联网装解释器。
      - name: Select preinstalled Ruby
        shell: bash
        run: |
          want="$(cat .ruby-version)"
          want_minor="$(echo "$want" | cut -d. -f1-2)"
          # 版本 a >= 下限 b 时 sort -V -C 退出 0
          ge() { printf '%s\n%s\n' "$2" "$1" | sort -V -C; }

          best=""
          for dir in /opt/hostedtoolcache/Ruby/*/x64; do
            [ -x "$dir/bin/ruby" ] || continue
            version="$("$dir/bin/ruby" -e 'print RUBY_VERSION')"
            ge "$version" "$want_minor" || continue
            if [ -z "$best" ] || ge "$version" "$best_version"; then
              best="$dir"; best_version="$version"
            fi
          done

          if [ -z "$best" ]; then
            echo "::error::镜像未预装 Ruby >= $want_minor（pin $want）"
            ls /opt/hostedtoolcache/Ruby/ || true
            exit 1
          fi
          echo "$best/bin" >> "$GITHUB_PATH"
          echo "selected Ruby $best_version from $best"

      - name: Verify Ruby meets the pin
        shell: bash
        run: |
          want="$(cat .ruby-version)"; want_minor="$(echo "$want" | cut -d. -f1-2)"
          have="$(ruby -e 'print RUBY_VERSION')"
          printf '%s\n%s\n' "$want_minor" "$have" | sort -V -C \
            || { echo "::error::已装 Ruby $have，低于 .ruby-version 要求的 $want_minor"; exit 1; }
          echo "Ruby $have ok（pin $want）"

      - name: Test the docs checker itself
        run: ruby tools/test_check_docs.rb

      - name: Check docs links, anchors and size
        run: ruby tools/check_docs.rb

      - name: Test agent process tools
        run: |
          ruby tools/test_sebas_process.rb
          ruby tools/test_sebas_process_regressions.rb
          ruby tools/test_docs_examples.rb
          ruby tools/test_oneline_sheet.rb
          ruby tools/test_backfill_script.rb
          ruby tools/test_ruby_version_guard.rb
          ruby tools/test_evidence_register.rb

      - name: Smoke test agent CLI
        run: |
          ruby tools/sebas-process version
          ruby tools/sebas-process roles --one-line
          ruby tools/sebas-process help

  # 确定性核验（#121）：把「文档声称的锚点」变成可机器核验的断言。
  #
  # 与 docs job 的分工（避免重复报告同一问题）：
  #   check_docs.rb —— 死链、行号锚（design.md:L<n> 形态）、单文件行数。
  #   本 job        —— 额外核验 docs 里 `src/x.cr:123` 形态引用的内容是否真的
  #                    与源码一致、行号是否越界。这是 check_docs.rb 没覆盖的。
  #
  # 与 changes job 无关：纯文档改动恰恰是它唯一要拦的场景，不能走 skip。
  # 生成物不入库：anchors.json 是派生物，在 CI 里即时生成后核验。
  # 范围限定 docs/：verify docs 的行号锚正则会命中 CONTRIBUTING.md 里
  # 讲解规则本身的那句示例（`design.md:L749`-style），那不是真锚点。
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Select preinstalled Ruby
        shell: bash
        run: |
          want="$(cat .ruby-version)"
          want_minor="$(echo "$want" | cut -d. -f1-2)"
          ge() { printf '%s\n%s\n' "$2" "$1" | sort -V -C; }

          best=""
          for dir in /opt/hostedtoolcache/Ruby/*/x64; do
            [ -x "$dir/bin/ruby" ] || continue
            version="$("$dir/bin/ruby" -e 'print RUBY_VERSION')"
            ge "$version" "$want_minor" || continue
            if [ -z "$best" ] || ge "$version" "$best_version"; then
              best="$dir"; best_version="$version"
            fi
          done

          if [ -z "$best" ]; then
            echo "::error::镜像未预装 Ruby >= $want_minor（pin $want）"
            ls /opt/hostedtoolcache/Ruby/ || true
            exit 1
          fi
          echo "$best/bin" >> "$GITHUB_PATH"
          echo "selected Ruby $best_version from $best"

      - name: Test the anchors extractor itself
        run: ruby tools/test_anchors_extract.rb

      # verify.yml 的安全属性（脚本取自 base）靠契约测试固定：
      # 若有人把 base.sha 改成 head.sha，仅靠人工 review 很容易漏过。
      - name: Test the PR verify workflow
        run: |
          ruby tools/test_verify_workflow.rb
          ruby tools/test_verify_reports.rb

      # 全量 docs 跑 verify docs：不限改动文件，防止旧文档劣化。
      # acceptable 级（存档行号锚）不算失败；blocker/must_fix 让退出码非 0。
      - name: Verify docs gate
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files 'docs/**/*.md')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::docs/ 下没有 markdown 文件，核验无对象"
            exit 1
          fi
          ruby tools/sebas-process verify docs "${files[@]}"

      - name: Verify doc code anchors against source
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files 'docs/**/*.md')
          ruby tools/anchors_extract.rb --output /tmp/anchors.json "${files[@]}"
          ruby tools/sebas-process verify anchors /tmp/anchors.json

  # 三平台 release 构建成本最高，只在 main 与手动触发时跑；PR 由 spec 覆盖
  # 编译正确性。下面的 if 保证 PR 不会进入这里，因此 macOS 直接走 self-hosted。
  release-build:
    name: release build / ${{ matrix.runner }}
    needs: [changes, spec]
    if: needs.changes.outputs.code == 'true' && github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
          - runner: macos-ci
          - runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Cache shards
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            lib
            ~/.cache/shards
          key: shards-${{ runner.os }}-${{ hashFiles('shard.yml', 'shard.lock') }}
          restore-keys: shards-${{ runner.os }}-

      - name: Install shards
        run: shards install --frozen

      - name: Create output directory
        shell: bash
        run: mkdir -p bin

      - name: Build release binary
        run: crystal build --release --no-debug -o bin/sebas src/main.cr

      - name: Smoke test
        shell: bash
        run: |
          bin="./bin/sebas"
          [ "${RUNNER_OS:-}" = "Windows" ] && bin="./bin/sebas.exe"
          "$bin" version

      - name: Crash-recovery drill (M0-WP8)
        run: crystal spec spec/platform/cli/gateway_spec.cr --no-color
