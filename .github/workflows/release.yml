name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build assets for (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: sebas-linux-x86_64
          - os: macos-latest
            artifact: sebas-macos-arm64
          - os: windows-latest
            artifact: sebas-windows-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Install shards
        run: shards install --frozen

      - name: Verify gates
        run: crystal spec --no-color

      - name: Create output directory
        shell: bash
        run: mkdir -p bin

      # Linux: link SQLite statically so the tarball runs on any glibc distro
      # without libsqlite3.so.0 installed. Other platforms use the system library.
      - name: Build release binary (Linux, static SQLite)
        if: runner.os == 'Linux'
        run: >
          crystal build --release --no-debug
          --link-flags '-Wl,-Bstatic -lsqlite3 -Wl,-Bdynamic'
          -o bin/sebas src/main.cr

      - name: Build release binary
        if: runner.os != 'Linux'
        run: crystal build --release --no-debug -o bin/sebas src/main.cr

      - name: Smoke test the binary
        shell: bash
        run: |
          bin="./bin/sebas"
          [ "$RUNNER_OS" = "Windows" ] && bin="./bin/sebas.exe"
          "$bin" version

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          name='${{ matrix.artifact }}'
          stage="dist/${name}"
          mkdir -p "$stage"
          cp bin/sebas "$stage/"
          cp README.md LICENSE CHANGELOG.md "$stage/"
          cp examples/config.example.yaml "$stage/"
          tar -C dist -czf "dist/${name}.tar.gz" "$name"
          if command -v sha256sum >/dev/null; then
            (cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")
          else
            (cd dist && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256")
          fi

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "${{ matrix.artifact }}"
          $stage = "dist/$name"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item bin/sebas.exe $stage
          Copy-Item bin/sqlite3.dll $stage -ErrorAction SilentlyContinue
          Copy-Item README.md, LICENSE, CHANGELOG.md $stage
          Copy-Item examples/config.example.yaml $stage
          Compress-Archive -Path $stage/* -DestinationPath "dist/$name.zip"
          Get-FileHash "dist/$name.zip" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $name.zip" } |
            Out-File -Encoding ascii "dist/$name.zip.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -l dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
