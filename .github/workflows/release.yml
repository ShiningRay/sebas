name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build assets for (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runner: ubuntu-latest
            artifact: sebas-linux-x86_64
          # 自托管 macOS runner（标签 macos-ci）；实际架构在打包步骤用 uname -m 决定，
          # 不再写死 arm64 —— 这台是 Intel X64。
          - os: macos-latest
            runner: macos-ci
            artifact: sebas-macos
          - os: windows-latest
            runner: windows-latest
            artifact: sebas-windows-x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Install shards
        run: shards install --frozen

      - name: Verify gates
        run: crystal spec --no-color

      - name: Create output directory
        shell: bash
        run: mkdir -p bin

      # Linux: static-link the C libraries a stock distro may not have
      # (sqlite3, yaml, pcre2). OpenSSL and zlib stay dynamic — every distro
      # ships them, and static OpenSSL needs extra provider setup.
      - name: Build release binary (Linux, static C libs)
        if: runner.os == 'Linux'
        run: >
          crystal build --release --no-debug
          --link-flags '-Wl,-Bstatic -lsqlite3 -lyaml -lpcre2-8 -Wl,-Bdynamic'
          -o bin/sebas src/main.cr

      - name: Build release binary
        if: runner.os != 'Linux'
        run: crystal build --release --no-debug -o bin/sebas src/main.cr

      - name: Smoke test the binary
        shell: bash
        run: |
          bin="./bin/sebas"
          [ "$RUNNER_OS" = "Windows" ] && bin="./bin/sebas.exe"
          "$bin" version

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          name='${{ matrix.artifact }}'
          # macOS 资产名带真实架构：self-hosted 机器可能是 Intel 也可能是 Apple Silicon。
          if [ "$RUNNER_OS" = "macOS" ]; then
            case "$(uname -m)" in
              arm64) name="${name}-arm64" ;;
              *) name="${name}-x86_64" ;;
            esac
          fi
          stage="dist/${name}"
          mkdir -p "$stage"
          cp bin/sebas "$stage/"
          cp README.md LICENSE CHANGELOG.md "$stage/"
          cp examples/config.example.yaml "$stage/"
          tar -C dist -czf "dist/${name}.tar.gz" "$name"
          if command -v sha256sum >/dev/null; then
            (cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")
          else
            (cd dist && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256")
          fi

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "${{ matrix.artifact }}"
          $stage = "dist/$name"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item bin/sebas.exe $stage
          Copy-Item bin/sqlite3.dll $stage -ErrorAction SilentlyContinue
          Copy-Item README.md, LICENSE, CHANGELOG.md $stage
          Copy-Item examples/config.example.yaml $stage
          Compress-Archive -Path $stage/* -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          # LF line ending so `sha256sum -c` accepts the file on Linux/macOS
          [IO.File]::WriteAllText("dist/$name.zip.sha256", "$hash  $name.zip`n")

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -l dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
