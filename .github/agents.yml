# Evidence 登记人白名单：sebas-process 用它校验验收证据的实际登记身份。
# 两个段位分离，不可混用：
#   maintainers  —— 人类（source="maintainer"），最终裁决权所在
#   trusted_bots —— 自动化身份（source="workflow"），仅限受信的 workflow 登记
# JSON 里写 source 字符串本身不是凭据；工具会回查 source_ref 评论的真实作者 login。
maintainers:
  - ShiningRay

# 允许代写 Evidence 的自动化身份。未列入者一律 invalid（fail-closed）。
# 注意：授予此权限等于授予「写入验收结论」的能力——
# 能改本仓库 workflow 的人即可伪造 Evidence，必须与 .github/ 审核红线配套。
trusted_bots:
  - github-actions[bot]

# coordinator 身份白名单（M4x-Parallel-WP2，#220；Proposal parallel-implementers.md §5.2）：
# 允许发/改带 <!-- sebas-lease --> marker 的租约评论。租约凭据是「谁持有这张卡」
# 的 GitHub 侧事实源——授予此权限等于授予「写入认领所有权」的能力，
# 口径同 trusted_bots：必须与 .github/ 审核红线配套；未列入者一律 invalid（fail-closed）。
coordinators:
  - ShiningRay

# 在途租约容量上限（recovery §5 / Q3；Maintainer 2026-11-27 指令提升为 2）。
# 缺键即 1，行为与单卡容量一致；非法值 fail-closed 拒绝启动。
# 边界：试点 docs-only 双卡豁免仅在容量 1 时生效；v1 运行记录（迁移窗口）
# 仍持有活动记录时有效容量钳回 1（Q10=B 迁移期容量恒 1）。
capacity: 2
